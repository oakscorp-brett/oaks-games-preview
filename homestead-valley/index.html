<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Homestead Valley</title>
<meta name="theme-color" content="#5b8c3a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Homestead">
<link rel="icon" href="icon.svg"><link rel="apple-touch-icon" href="icon.svg">
<link rel="stylesheet" href="core.css">
<link rel="stylesheet" href="game.css">
</head><body>
<div id="app">
  <div id="hud">
    <button id="hlvl" class="hp"><b id="lvn">1</b><div class="xpb"><div id="xpf"></div></div></button>
    <button id="hcoin" class="hp">🪙 <span id="cnv">0</span></button>
    <button id="hgem" class="hp">💎 <span id="gmv">0</span></button>
    <button id="hbarn" class="hp">🏚️ <span id="bnv">0</span></button>
    <button id="setbtn" class="hp ic">⚙️</button>
  </div>
  <div id="strip">
    <button id="dailybtn" class="sb">📅<small>Daily</small></button>
    <button id="taskbtn" class="sb">📋<small>Tasks</small></button>
    <button id="passbtn" class="sb">🎖️<small>Pass</small></button>
    <button id="evbtn" class="sb ev">🎡<small>Fair</small></button>
    <button id="vaultbtn" class="sb">🐷<small>0</small></button>
    <button id="achbtn" class="sb">🏆<small>Trophy</small></button>
    <button id="albumbtn" class="sb">📖<small>Almanac</small></button>
  </div>
  <div id="scrFarm" class="scr on"><div id="farm"></div></div>
  <div id="scrOrders" class="scr"><div id="orders"></div></div>
  <div id="nav">
    <button id="navFarm" class="nb on">🚜<small>Farm</small></button>
    <button id="navOrders" class="nb">📜<small>Orders</small></button>
    <button id="navBarn" class="nb">🏚️<small>Barn</small></button>
    <button id="navShop" class="nb">🛒<small>Shop</small></button>
  </div>
</div>
<script src="core.js"></script>
<script src="game.js"></script>
</body></html>
